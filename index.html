<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>User Grid</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="page-header">
    <div>
      <p class="eyebrow">Team Directory</p>
      <h1>User detail grid</h1>
      <p class="subtitle">A responsive grid that highlights quick facts about each teammate.</p>
    </div>
    <div class="summary">
      <p><strong id="user-count"></strong> people</p>
      <p class="summary-note">Click on any card for the full profile.</p>
    </div>
  </header>

  <main>
    <section class="grid" id="user-grid" aria-label="User details"></section>
  </main>

  <script type="module" src="main.js"></script>
</body>
</html>
